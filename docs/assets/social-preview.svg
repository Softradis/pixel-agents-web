<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">pixel-agents-web social preview</title>
  <desc id="desc">A dark pixel-art inspired banner for pixel-agents-web, a visual dashboard for AI agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#102b3c"/>
      <stop offset="1" stop-color="#12352f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <g opacity="0.18" fill="none" stroke="#8dd7ff" stroke-width="1">
    <path d="M0 120h1280M0 240h1280M0 360h1280M0 480h1280"/>
    <path d="M160 0v640M320 0v640M480 0v640M640 0v640M800 0v640M960 0v640M1120 0v640"/>
  </g>

  <g transform="translate(96 96)" filter="url(#shadow)">
    <rect x="0" y="0" width="448" height="360" rx="28" fill="#111827" stroke="#334155" stroke-width="4"/>
    <rect x="40" y="52" width="368" height="256" rx="18" fill="#182235" stroke="#4f6b8a" stroke-width="3"/>
    <path d="M64 132h140v82H64z" fill="#254f68"/>
    <path d="M244 132h140v82H244z" fill="#2e624f"/>
    <path d="M64 238h320v38H64z" fill="#283144"/>
    <rect x="90" y="156" width="48" height="62" rx="8" fill="#8dd7ff"/>
    <rect x="292" y="156" width="48" height="62" rx="8" fill="#ffca7a"/>
    <rect x="103" y="126" width="22" height="22" rx="4" fill="#d8f1ff"/>
    <rect x="305" y="126" width="22" height="22" rx="4" fill="#ffe0aa"/>
    <path d="M150 180h116" stroke="#c7a6ff" stroke-width="10" stroke-linecap="round" stroke-dasharray="18 16"/>
    <path d="M260 164l28 16-28 16z" fill="#c7a6ff"/>
    <rect x="178" y="66" width="96" height="36" rx="10" fill="#35d399"/>
    <text x="226" y="91" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#06281d">OK</text>
  </g>

  <g transform="translate(610 142)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="900" fill="#ffffff">pixel-agents-web</text>
    <text x="0" y="66" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#8dd7ff">Visual dashboard for AI agents</text>
    <text x="0" y="132" font-family="Inter, Arial, sans-serif" font-size="26" fill="#d6e4f0">Show arrivals, handoffs, decisions, work</text>
    <text x="0" y="170" font-family="Inter, Arial, sans-serif" font-size="26" fill="#d6e4f0">and real completion events in a pixel office.</text>

    <g transform="translate(0 228)" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">
      <rect x="0" y="0" width="146" height="44" rx="22" fill="#183f5a"/>
      <text x="73" y="29" text-anchor="middle" fill="#d8f1ff">AI agents</text>
      <rect x="164" y="0" width="168" height="44" rx="22" fill="#244c3e"/>
      <text x="248" y="29" text-anchor="middle" fill="#d9fbe8">Real-time</text>
      <rect x="350" y="0" width="132" height="44" rx="22" fill="#563a62"/>
      <text x="416" y="29" text-anchor="middle" fill="#f2dcff">MIT</text>
    </g>
  </g>
